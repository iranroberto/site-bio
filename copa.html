<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produtos Copa do Mundo</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root {
    --bg: #05291f;
    --panel: #083b2f;
    --green: #00a859;
    --blue: #1d4ed8;
    --gold: #ffd400;
    --text: #fffafc;
    --dark: #06281f;
}

* {
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    margin: 0;
    font-family: "Montserrat", Arial, sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 16% 10%, rgba(0, 168, 89, 0.32), transparent 28rem),
        radial-gradient(circle at 86% 18%, rgba(255, 212, 0, 0.28), transparent 24rem),
        radial-gradient(circle at 50% 100%, rgba(29, 78, 216, 0.25), transparent 30rem),
        linear-gradient(145deg, #031c17 0%, var(--bg) 55%, #09244f 100%);
}

a {
    color: inherit;
    text-decoration: none;
}

.page {
    width: min(1080px, 100%);
    margin: 0 auto;
    padding: 22px 14px 36px;
}

.hero {
    position: relative;
    overflow: hidden;
    padding: 30px 18px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 26px;
    text-align: center;
    background:
        radial-gradient(circle at 20% 20%, rgba(255, 212, 0, 0.26), transparent 14rem),
        radial-gradient(circle at 80% 80%, rgba(29, 78, 216, 0.24), transparent 16rem),
        linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.05)),
        var(--panel);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.30);
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    padding: 8px 13px;
    border-radius: 999px;
    background: linear-gradient(135deg, #fff16b, #00a859, #1d4ed8);
    color: var(--dark);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
}

h1 {
    margin: 0;
    font-size: clamp(32px, 8vw, 58px);
    line-height: 1.05;
    font-weight: 800;
}

.subtitle {
    width: min(680px, 100%);
    margin: 14px auto 0;
    color: rgba(255, 255, 255, 0.84);
    font-size: clamp(14px, 3.5vw, 17px);
    font-weight: 600;
    line-height: 1.55;
}

.back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
    color: #fff7b0;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
}

.category {
    margin-top: 32px;
}

.section-header {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
}

.section-header h2 {
    margin: 0;
    font-size: clamp(22px, 5vw, 34px);
    line-height: 1.1;
    font-weight: 800;
}

.section-note {
    flex: 0 0 auto;
    padding: 7px 10px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    color: #fff7b0;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
}

.products {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
}

.card {
    min-width: 0;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;
    background: #fff;
    color: #171923;
    box-shadow: 0 18px 42px rgba(0, 0, 0, 0.24);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
}

.card:hover {
    transform: translateY(-3px);
    box-shadow: 0 22px 52px rgba(0, 168, 89, 0.20), 0 18px 42px rgba(0, 0, 0, 0.26);
}

.media {
    display: grid;
    place-items: center;
    min-height: 132px;
    background:
        radial-gradient(circle at 50% 44%, rgba(255, 255, 255, 0.92) 0 32%, transparent 33%),
        linear-gradient(135deg, #fff16b, #e9fff2 48%, #dbeafe);
}

.media i {
    color: var(--dark);
    font-size: 46px;
    filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.14));
}

.card-content {
    display: flex;
    min-height: 142px;
    flex-direction: column;
    padding: 14px;
}

.card h2 {
    margin: 0 0 8px;
    font-size: 15px;
    font-weight: 800;
    line-height: 1.3;
}

.card p {
    margin: 0 0 14px;
    color: #5f6676;
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.45;
}

.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
    margin-top: auto;
    border-radius: 12px;
    background: linear-gradient(135deg, #fff16b 0%, #00a859 54%, #1d4ed8 100%);
    color: var(--dark);
    font-size: 12px;
    font-weight: 800;
    text-align: center;
    text-transform: uppercase;
}

@media (min-width: 720px) {
    .products {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
    }
}

@media (max-width: 520px) {
    .section-header {
        align-items: flex-start;
        flex-direction: column;
    }
}
</style>
</head>

<body>
<main class="page">
    <header class="hero">
        <div class="badge"><i class="fa-solid fa-trophy" aria-hidden="true"></i> Produtos Copa do Mundo</div>
        <h1>Achadinhos para torcer</h1>
        <p class="subtitle">Selecao de buscas rapidas para encontrar camisetas, decoracao, acessorios e itens para assistir aos jogos no clima da Copa.</p>
        <a class="back-link" href="index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Voltar para o inicio</a>
    </header>

    <div id="productSections"></div>
</main>
<script>
const categories = [
    {
        title: "Camisetas e looks para torcer",
        icon: "fa-shirt",
        note: "9 opcoes",
        description: "Look para entrar no clima da Copa em casa, no churrasco ou com a galera.",
        items: [
            ["Camisa Brasil torcedor", "https://lista.mercadolivre.com.br/camisa-brasil-torcedor"],
            ["Camiseta amarela Brasil", "https://lista.mercadolivre.com.br/camiseta-amarela-brasil-copa"],
            ["Camisa verde Brasil", "https://lista.mercadolivre.com.br/camisa-verde-brasil-copa"],
            ["Kit camiseta casal Brasil", "https://lista.mercadolivre.com.br/kit-camiseta-casal-brasil"],
            ["Camiseta infantil Brasil", "https://lista.mercadolivre.com.br/camiseta-infantil-brasil-copa"],
            ["Bone Brasil torcida", "https://lista.mercadolivre.com.br/bone-brasil-torcida"],
            ["Shorts Brasil torcida", "https://lista.mercadolivre.com.br/shorts-brasil-torcida"],
            ["Moletom Brasil Copa", "https://lista.mercadolivre.com.br/moletom-brasil-copa"],
            ["Look completo torcida Brasil", "https://lista.mercadolivre.com.br/look-torcida-brasil-copa"]
        ]
    },
    {
        title: "Bolas e itens de futebol",
        icon: "fa-futbol",
        note: "9 opcoes",
        description: "Produtos para brincar, treinar e completar o clima de futebol.",
        items: [
            ["Bola Copa do Mundo", "https://lista.mercadolivre.com.br/bola-copa-do-mundo"],
            ["Bola de futebol campo", "https://lista.mercadolivre.com.br/bola-futebol-campo"],
            ["Bola society", "https://lista.mercadolivre.com.br/bola-futebol-society"],
            ["Bola futsal", "https://lista.mercadolivre.com.br/bola-futsal"],
            ["Mini bola decorativa", "https://lista.mercadolivre.com.br/mini-bola-futebol-decorativa"],
            ["Chuteira campo", "https://lista.mercadolivre.com.br/chuteira-campo"],
            ["Chuteira society", "https://lista.mercadolivre.com.br/chuteira-society"],
            ["Luva de goleiro", "https://lista.mercadolivre.com.br/luva-goleiro"],
            ["Kit treino futebol", "https://lista.mercadolivre.com.br/kit-treino-futebol"]
        ]
    },
    {
        title: "Bandeiras e decoracao",
        icon: "fa-flag",
        note: "9 opcoes",
        description: "Itens para deixar sala, varanda ou area gourmet pronta para a torcida.",
        items: [
            ["Bandeira do Brasil", "https://lista.mercadolivre.com.br/bandeira-brasil"],
            ["Bandeirinhas Brasil", "https://lista.mercadolivre.com.br/bandeirinhas-brasil-copa"],
            ["Painel decorativo Copa", "https://lista.mercadolivre.com.br/painel-decorativo-copa"],
            ["Baloes verde amarelo", "https://lista.mercadolivre.com.br/baloes-verde-amarelo"],
            ["Toalha de mesa Brasil", "https://lista.mercadolivre.com.br/toalha-mesa-brasil-copa"],
            ["Adesivos Copa do Mundo", "https://lista.mercadolivre.com.br/adesivos-copa-do-mundo"],
            ["Faixa torcida Brasil", "https://lista.mercadolivre.com.br/faixa-torcida-brasil"],
            ["Enfeites Copa do Mundo", "https://lista.mercadolivre.com.br/enfeites-copa-do-mundo"],
            ["Kit festa Brasil", "https://lista.mercadolivre.com.br/kit-festa-brasil-copa"]
        ]
    },
    {
        title: "Eletronicos para assistir",
        icon: "fa-tv",
        note: "9 opcoes",
        description: "Achadinhos para melhorar imagem, som e conforto na hora dos jogos.",
        items: [
            ["Smart TV", "https://lista.mercadolivre.com.br/smart-tv"],
            ["TV 4K", "https://lista.mercadolivre.com.br/tv-4k"],
            ["Projetor portatil", "https://lista.mercadolivre.com.br/projetor-portatil"],
            ["Caixa de som Bluetooth", "https://lista.mercadolivre.com.br/caixa-som-bluetooth"],
            ["Soundbar", "https://lista.mercadolivre.com.br/soundbar"],
            ["Suporte para TV", "https://lista.mercadolivre.com.br/suporte-tv"],
            ["Antena digital", "https://lista.mercadolivre.com.br/antena-digital"],
            ["Controle universal", "https://lista.mercadolivre.com.br/controle-universal-tv"],
            ["Cabo HDMI", "https://lista.mercadolivre.com.br/cabo-hdmi"]
        ]
    },
    {
        title: "Copos, petiscos e cozinha",
        icon: "fa-mug-saucer",
        note: "9 opcoes",
        description: "Tudo para montar mesa, lanche e cantinho do jogo com praticidade.",
        items: [
            ["Copo Brasil", "https://lista.mercadolivre.com.br/copo-brasil"],
            ["Copo termico Brasil", "https://lista.mercadolivre.com.br/copo-termico-brasil"],
            ["Caneca Brasil", "https://lista.mercadolivre.com.br/caneca-brasil"],
            ["Kit churrasco", "https://lista.mercadolivre.com.br/kit-churrasco"],
            ["Petisqueira", "https://lista.mercadolivre.com.br/petisqueira"],
            ["Tabua de frios", "https://lista.mercadolivre.com.br/tabua-de-frios"],
            ["Pipoqueira", "https://lista.mercadolivre.com.br/pipoqueira"],
            ["Fritadeira eletrica", "https://lista.mercadolivre.com.br/air-fryer"],
            ["Balde de gelo", "https://lista.mercadolivre.com.br/balde-de-gelo"]
        ]
    }
];

const productSections = document.getElementById("productSections");

categories.forEach((category) => {
    const section = document.createElement("section");
    section.className = "category";
    section.innerHTML = `
        <div class="section-header">
            <h2>${category.title}</h2>
            <span class="section-note">${category.note}</span>
        </div>
        <div class="products" aria-label="${category.title}"></div>
    `;

    const products = section.querySelector(".products");

    category.items.forEach(([title, url]) => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
            <div class="media"><i class="fa-solid ${category.icon}" aria-hidden="true"></i></div>
            <div class="card-content">
                <h2>${title}</h2>
                <p>${category.description}</p>
                <a class="btn" href="${url}" target="_blank" rel="noopener">Ver ofertas</a>
            </div>
        `;
        products.appendChild(card);
    });

    productSections.appendChild(section);
});
</script>
</body>
</html>
